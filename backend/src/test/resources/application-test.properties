spring.datasource.url=jdbc:h2:mem:espaza_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
